name: ReBarState CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  rebarstate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: ReBarState Linux
            artifact-path: build/ReBarState
          - os: windows-latest
            artifact-name: ReBarState Windows
            artifact-path: build/Release/ReBarState.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      working-directory: ./ReBarState
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      working-directory: ./ReBarState
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{github.workspace}}/${{ matrix.artifact-path }}
